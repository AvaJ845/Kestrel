name: Kestrel
options:
  bundleIdPrefix: com.avaresearch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: en
    SWIFT_STRICT_CONCURRENCY: complete
schemes:
  Kestrel:
    build:
      targets:
        Kestrel: all
        KestrelTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Products.storekit
    test:
      targets:
        - KestrelTests
targets:
  Kestrel:
    type: application
    platform: iOS
    sources:
      - path: Kestrel
    info:
      path: Kestrel/App/Info.plist
      properties:
        CFBundleDisplayName: Kestrel
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_NAME: Kestrel
        PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.kestrel
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Midnight AppIcon-Mono
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
  KestrelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KestrelTests
    dependencies:
      - target: Kestrel
    settings:
      base:
        PRODUCT_NAME: KestrelTests
        PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.kestrel.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Kestrel.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Kestrel"
        BUNDLE_LOADER: "$(TEST_HOST)"
